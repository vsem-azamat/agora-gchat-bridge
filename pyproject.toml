[project]
name = "agora-gchat-bridge"
version = "0.1.0"
description = "Agora bridge for one Google Chat space"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "google-auth-oauthlib>=1.2",
]

[project.urls]
Repository = "https://github.com/vsem-azamat/agora-gchat-bridge"

[project.scripts]
gchat-bridge = "gchat_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gchat_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
